<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">Changelog &amp; Library</title>
  <desc id="d">What shipped, in plain language, and the write-ups behind it. The picture: 11 numbered stops on a line that climbs, each arriving in turn. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f271b"/><stop offset="1" stop-color="#18181a"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#b45309"/><stop offset="0.50" stop-color="#d97706"/><stop offset="1.00" stop-color="#edbb70"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#d97706" stop-opacity="0"/><stop offset=".35" stop-color="#d97706"/><stop offset="1" stop-color="#edbb70"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <g stroke="#513717" stroke-width="1" opacity=".5">
    <path d="M668 28V222"/>
    <path d="M738 28V222"/>
    <path d="M809 28V222"/>
    <path d="M879 28V222"/>
    <path d="M949 28V222"/>
    <path d="M1019 28V222"/>
    <path d="M1090 28V222"/>
    <path d="M1160 28V222"/>
    <path d="M668 28H1160"/>
    <path d="M668 93H1160"/>
    <path d="M668 157H1160"/>
    <path d="M668 222H1160"/>
    </g>
    <path class="draw" pathLength="100" d="M692.0 198.0 L736.4 181.6 L780.8 180.7 L825.2 177.9 L869.6 142.3 L914.0 148.4 L958.4 120.8 L1002.8 88.5 L1047.2 95.2 L1091.6 64.7 L1136.0 56.0" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.30s"/>
    <circle class="halo" cx="1136.0" cy="56.0" r="13" fill="none" stroke="#edbb70" stroke-width="2"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <g class="arrive" style="animation-delay:0.40s"><circle cx="692.0" cy="198.0" r="13" fill="#18181a" stroke="#d97706" stroke-width="2.5"/><text x="692.0" y="202.5" fill="#edbb70">1</text></g>
    <g class="arrive" style="animation-delay:0.68s"><circle cx="736.4" cy="181.6" r="13" fill="#18181a" stroke="#d97706" stroke-width="2.5"/><text x="736.4" y="186.1" fill="#edbb70">2</text></g>
    <g class="arrive" style="animation-delay:0.96s"><circle cx="780.8" cy="180.7" r="13" fill="#18181a" stroke="#d97706" stroke-width="2.5"/><text x="780.8" y="185.2" fill="#edbb70">3</text></g>
    <g class="arrive" style="animation-delay:1.24s"><circle cx="825.2" cy="177.9" r="13" fill="#18181a" stroke="#d97706" stroke-width="2.5"/><text x="825.2" y="182.4" fill="#edbb70">4</text></g>
    <g class="arrive" style="animation-delay:1.52s"><circle cx="869.6" cy="142.3" r="13" fill="#18181a" stroke="#d97706" stroke-width="2.5"/><text x="869.6" y="146.8" fill="#edbb70">5</text></g>
    <g class="arrive" style="animation-delay:1.80s"><circle cx="914.0" cy="148.4" r="13" fill="#18181a" stroke="#d97706" stroke-width="2.5"/><text x="914.0" y="152.9" fill="#edbb70">6</text></g>
    <g class="arrive" style="animation-delay:2.08s"><circle cx="958.4" cy="120.8" r="13" fill="#18181a" stroke="#d97706" stroke-width="2.5"/><text x="958.4" y="125.3" fill="#edbb70">7</text></g>
    <g class="arrive" style="animation-delay:2.36s"><circle cx="1002.8" cy="88.5" r="13" fill="#18181a" stroke="#d97706" stroke-width="2.5"/><text x="1002.8" y="93.0" fill="#edbb70">8</text></g>
    <g class="arrive" style="animation-delay:2.64s"><circle cx="1047.2" cy="95.2" r="13" fill="#18181a" stroke="#d97706" stroke-width="2.5"/><text x="1047.2" y="99.7" fill="#edbb70">9</text></g>
    <g class="arrive" style="animation-delay:2.92s"><circle cx="1091.6" cy="64.7" r="13" fill="#18181a" stroke="#d97706" stroke-width="2.5"/><text x="1091.6" y="69.2" fill="#edbb70">10</text></g>
    <g class="arrive" style="animation-delay:3.20s"><circle cx="1136.0" cy="56.0" r="13" fill="#18181a" stroke="#d97706" stroke-width="2.5"/><text x="1136.0" y="60.5" fill="#edbb70">11</text></g>
    </g>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#6b4f1d"/><rect x="300.0" y="248" width="300.5" height="12" fill="#b45309"/><rect x="600.0" y="248" width="300.5" height="12" fill="#d97706"/><rect x="900.0" y="248" width="300.5" height="12" fill="#fef3c7"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="58.8" fill="#d97706" font-size="15" font-weight="700" letter-spacing=".6">The Holy Earth Foundation</text><text x="56" y="120.6" fill="#fef3c7" font-size="56" font-weight="700" letter-spacing="-.5">Changelog &amp; Library</text><text x="56" y="163.8" fill="#e1d6af" font-size="23">What shipped, in plain language, and the write-ups</text><text x="56" y="194.6" fill="#e1d6af" font-size="23">behind it.</text></g>
  </g>
